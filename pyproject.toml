[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vectorgrad"
version = "0.1.0"
description = "A small autograd engine, from scalars to tensors"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "torch"]

[tool.setuptools.packages.find]
include = ["vectorgrad*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
